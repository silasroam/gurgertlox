<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Assets Preview</title>
    <style>
        body{background:#09090B;color:#FFF8E7;font-family:Manrope,sans-serif;padding:20px}
        h1{font-size:24px;margin-bottom:10px}
        .stats{color:#A7A4A0;font-size:14px;margin-bottom:20px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
        .card{background:#11141A;border:1px solid rgba(255,255,255,0.06);border-radius:12px;overflow:hidden}
        .card:hover{border-color:#1683FF;transform:translateY(-2px)}
        .card img{width:100%;aspect-ratio:1;object-fit:contain;background:#0d1017;padding:8px}
        .card .name{padding:8px;font-size:11px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    </style>
</head>
<body>
    <h1>Assets Preview</h1>
    <div class="stats" id="stats"></div>
    <div class="grid" id="grid"></div>
    <script>
        const assets = [
            "artisan_brick","astral_shard","bday_candle","berry_box","big_year","bling_binky",
            "bonded_ring","bow_tie","bunny_muffin","candy_cane","case","chill_flame","clover_pin",
            "coconut_drink","coffin","cookie_heart","crystal_ball","cupid_charm","desk_calendar",
            "diamond_ring","durovs_boots","durovs_cap","durovs_coat","durovs_figurine","durovs_glasses",
            "easter_cake","easter_egg","eight_roses","electric_skull","eternal_candle","eternal_rose",
            "evil_eye","faith_amulet","flying_broom","fresh_socks","gem_signet","genie_lamp",
            "ginger_cookie","gravestone","hanging_star","happy_brownie","heart_locket","heart_pendant",
            "heroic_helmet","hex_pot","holiday_drink","homemade_cake","hypno_lollipop","ice_cream",
            "input_key","instant_ramen","ion_gem","ionic_dryer","jackinthebox","jelly_bunny",
            "jester_hat","jingle_bells","jolly_chimp","joyful_bundle","khabibs_papakha","kissed_frog",
            "liberty_figure","light_sword","lol_pop","loot_bag","love_candle","love_potion",
            "low_rider","lunar_snake","lush_bouquet","mad_pumpkin","magic_potion","may","mighty_arm",
            "mini_oscar","money_pot","mood_pack","moon_pendant","mousse_cake","nail_bracelet",
            "neko_helmet","party_sparkler","perfume_bottle","pet_snake","plush_pepe","pool_float",
            "precious_peach","pretty_posy","rare_bird","record_player","red_star","redo",
            "restless_jar","sakura_flower","sand_castle","santa_hat","scared_cat","sharp_tongue",
            "signet_ring","skull_flower","sky_stilettos","sleigh_bell","snake_box","snoop_cigar",
            "snoop_dogg","snow_globe","snow_mittens","spiced_wine","spring_basket","spy_agaric",
            "star_notepad","stellar_rocket","surge_board","swag_bag","swiss_watch","tama_gadget",
            "telegram_pin","timeless_book","top_hat","toy_bear","trapped_heart","triple_meow",
            "trojan_horse","ufc_strike","valentine_box","vice_cream","victory_medal","vintage_cigar",
            "voodoo_doll","westside_sign","whip_cupcake","winter_wreath","witch_hat","xmas_stocking"
        ];
        const grid = document.getElementById("grid");
        const stats = document.getElementById("stats");
        assets.forEach(name => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<img src="TelegramGiftsAssests-main/webp/by_name/${name}.webp" alt="${name}"><div class="name">${name}</div>`;
            grid.appendChild(card);
        });
        stats.textContent = "Total: " + assets.length + " assets";
    </script>
</body>
</html>
